[package]
name = "packslip"
description = "A vendor-neutral signed release manifest: what shipped, and how to verify it"
version = "1.6.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/jdx/packslip"
homepage = "https://packslip.dev"
authors = ["Jeff Dickey <@jdx>", "Shunsuke Suzuki <@suzuki-shunsuke>"]
keywords = ["sigstore", "in-toto", "release", "supply-chain", "minisign"]
categories = ["command-line-utilities", "cryptography"]
# Keep the actions and the scripts they run in the package so action-only
# changes trigger a shared release; the site's Worker is not the crate's.
exclude = ["content/", "data/", "layouts/", "static/", "hugo.toml", "cloudflare/", "wrangler.jsonc", ".github/", "CHANGELOG.md", "RELEASING.md", "cliff.toml", "release-plz.toml", "action/release.json"]

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "packslip"
path = "src/main.rs"
required-features = ["verify-cli"]

[[test]]
name = "verifier_cli"
path = "tests/verifier_cli.rs"
required-features = ["verify-cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

# A consumer that only verifies a packslip and reads what it says takes the
# crate with `default-features = false`: the schema, the verifier, and the
# selection rules, without the archive readers, the executable decoder, the
# signing path, or the CLI. Everything is on by default, so the binary and
# existing dependents are unaffected.
[features]
default = ["cli"]
# The complete CLI keeps its existing publishing and schema commands.
cli = ["install-cli", "create", "manifest", "schema"]
# A complete bootstrap installer suitable for distro packaging, without signing.
install-cli = ["verify-cli", "install-launcher", "install-host"]
# A verifier binary for consumers that do not need installation.
verify-cli = ["dep:color-eyre", "dep:eyre", "dep:usage_rs"]
# Authenticated, fresh trust-root refresh and offline cache replay.
trust-root = ["dep:sigstore-tuf", "dep:reqwest", "dep:tempfile", "sigstore-trust-root/tuf"]
discovery = ["trust-root", "dep:rustix", "dep:windows-sys"]
install-policy = ["discovery", "dep:toml"]
install-extract = ["archive", "dep:tempfile", "dep:lzma-rust2"]
install-fs = ["install-policy", "install-extract", "dep:windows-permissions", "dep:exacl", "dep:nix", "dep:libc"]
install-launcher = ["install-fs"]
install-host = ["discovery", "dep:known-folders", "dep:winreg", "dep:goblin"]
# `packslip create`: build a statement from a set of built artifacts.
create = ["archive", "linkage", "sign"]
# Read a release TOML manifest for `packslip create --manifest`.
manifest = ["dep:toml"]
# Decode tar and zip archives to resolve the paths of declared executables.
archive = ["dep:bzip2", "dep:flate2", "dep:lzma-rs", "dep:ruzstd", "dep:tar", "dep:zip"]
# Derive `requires.libs` by reading ELF, Mach-O, and PE executables.
linkage = ["archive", "dep:goblin"]
# Sign statements, keylessly through Fulcio or with a minisign key.
# Verification never needs this.
sign = ["dep:getrandom", "dep:sigstore-oidc", "dep:sigstore-sign"]
# JSON Schema for the statement types.
schema = ["dep:schemars"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }
sigstore-tuf = { version = "0.13", default-features = false, optional = true }
tempfile = { version = "3", optional = true }
base64 = "0.23"
blake2 = "0.11"
bzip2 = { version = "0.6", optional = true }
color-eyre = { version = "0.6", optional = true }
ed25519-dalek = "3"
eyre = { version = "0.6", optional = true }
flate2 = { version = "1", optional = true }
getrandom = { version = "0.4", optional = true }
goblin = { version = "0.10", optional = true }
hex = "0.4"
jiff = "0.2"
lzma-rust2 = { version = "0.20", default-features = false, features = ["std", "xz"], optional = true }
lzma-rs = { version = "0.3", optional = true }
schemars = { version = "1", optional = true }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sigstore-bundle = { version = "0.13", default-features = false }
sigstore-oidc = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
sigstore-rekor = { version = "0.13", default-features = false, features = ["rustls"] }
sigstore-sign = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
sigstore-trust-root = { version = "0.13", default-features = false, features = ["rustls"] }
sigstore-types = "0.13"
ruzstd = { version = "0.9", optional = true }
sigstore-verify = { version = "0.13", default-features = false, features = ["rustls"] }
tar = { version = "0.4", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
toml = { version = "1", optional = true }
# Reads the forge's repository and owner IDs from a Fulcio certificate.
# sigstore-verify already depends on it, so it adds no crate.
x509-cert = { version = "0.3", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate"], optional = true }
# usage-rs derives scan this table line by line for the alias below.
usage_rs = { package = "usage-rs", version = "6", features = ["completions"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"], optional = true }

[target.'cfg(windows)'.dependencies]
known-folders = { version = "1.4", optional = true }
winreg = { version = "0.56", optional = true }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"], optional = true }
windows-permissions = { version = "0.2.4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
exacl = { version = "0.13", optional = true }
nix = { version = "0.31", default-features = false, features = ["user"], optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
dsse = "0.1.1"
serde_yaml_bw = "2"
tempfile = "3"
which = "8"

[[test]]
name = "compatibility"
required-features = ["verify-cli"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 1
