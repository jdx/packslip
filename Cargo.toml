[package]
name = "packslip"
description = "A vendor-neutral signed release manifest: what shipped, and how to verify it"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/jdx/packslip"
homepage = "https://packslip.dev"
authors = ["Jeff Dickey <@jdx>"]
keywords = ["sigstore", "in-toto", "release", "supply-chain", "minisign"]
categories = ["command-line-utilities", "cryptography"]
exclude = ["content/", "data/", "layouts/", "static/", "hugo.toml", ".github/", "action.yml", "CHANGELOG.md", "RELEASING.md", "cliff.toml", "release-plz.toml"]

[[bin]]
name = "packslip"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
blake2 = "0.10"
bzip2 = "0.6"
color-eyre = "0.6"
ed25519-dalek = "2"
eyre = "0.6"
flate2 = "1"
getrandom = "0.3"
goblin = "0.10"
jiff = "0.2"
lzma-rs = "0.3"
ruzstd = "0.8"
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sigstore-bundle = { version = "0.11", default-features = false, features = ["rustls"] }
sigstore-oidc = { version = "0.11", default-features = false, features = ["rustls"] }
sigstore-rekor = { version = "0.11", default-features = false, features = ["rustls"] }
sigstore-sign = { version = "0.11", default-features = false, features = ["rustls"] }
sigstore-trust-root = { version = "0.11", default-features = false, features = ["rustls"] }
sigstore-types = "0.11"
sigstore-verify = { version = "0.11", default-features = false, features = ["rustls"] }
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
# usage-rs derives scan this table line by line for the alias below.
usage_rs = { package = "usage-rs", version = "6", features = ["completions"] }
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma"] }

[dev-dependencies]
tempfile = "3"
which = "8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
