name: packslip
description: >
  Publish a signed packslip for a release: attest the artifacts' build
  provenance, digest them, sign the release manifest keylessly with this
  job's OIDC identity, and upload packslip.sigstore.json as a release asset.
author: Jeff Dickey <@jdx>
branding:
  icon: package
  color: red

inputs:
  artifacts:
    description: Artifact files or globs, whitespace separated (dist/*.tar.xz dist/*.zip)
    required: true
  project:
    description: The project's name; defaults to github.com/<owner>/<repo>
    required: false
    default: ""
  version:
    description: The release version; defaults to the tag name without a leading v
    required: false
    default: ""
  tag:
    description: The release tag to upload to; defaults to the tag that triggered the job
    required: false
    default: ""
  url-base:
    description: Download URL prefix; defaults to this release's download URL
    required: false
    default: ""
  bin:
    description: Executables inside every archive, whitespace separated (relative to the archive root)
    required: false
    default: ""
  supersedes:
    description: The version this release replaces
    required: false
    default: ""
  sbom:
    description: URL of an SBOM for the release
    required: false
    default: ""
  attest:
    description: >
      Also attest SLSA build provenance for every artifact with
      actions/attest-build-provenance and link it from the packslip. Needs
      the attestations: write permission.
    required: false
    default: "true"
  out:
    description: Directory to write packslip.sigstore.json into
    required: false
    default: packslip
  upload:
    description: Upload the packslip to the release
    required: false
    default: "true"
  packslip-version:
    description: The packslip release to run
    required: false
    default: "0.2.0"
  token:
    description: Token for downloading packslip and uploading assets
    required: false
    default: ${{ github.token }}

outputs:
  bundle:
    description: Path of the written packslip.sigstore.json
    value: ${{ steps.create.outputs.bundle }}

runs:
  using: composite
  steps:
    - name: Install packslip
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PACKSLIP_VERSION: ${{ inputs.packslip-version }}
      run: |
        set -euo pipefail
        case "$(uname -s)" in
          Linux) os=linux ;;
          Darwin) os=darwin ;;
          MINGW*|MSYS*|CYGWIN*) os=windows ;;
          *) echo "unsupported OS: $(uname -s)" >&2; exit 1 ;;
        esac
        case "$(uname -m)" in
          x86_64|amd64) arch=x64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
        esac
        if [ "$os" = windows ]; then ext=zip; else ext=tar.xz; fi
        asset="packslip-v${PACKSLIP_VERSION}-${os}-${arch}.${ext}"
        dir="${RUNNER_TEMP}/packslip-bin"
        mkdir -p "$dir"
        gh release download "v${PACKSLIP_VERSION}" -R jdx/packslip -p "$asset" -D "$dir" --clobber
        # The archive was built by jdx/packslip's release workflow; check that before running it.
        gh attestation verify "$dir/$asset" -R jdx/packslip
        if [ "$ext" = zip ]; then
          (cd "$dir" && unzip -oq "$asset")
        else
          tar -xJf "$dir/$asset" -C "$dir" --strip-components=1
        fi
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/packslip" version

    - name: Collect artifacts
      id: files
      shell: bash
      env:
        IN_ARTIFACTS: ${{ inputs.artifacts }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=()
        for pattern in $IN_ARTIFACTS; do
          for f in $pattern; do [ -f "$f" ] && files+=("$f"); done
        done
        if [ "${#files[@]}" -eq 0 ]; then
          echo "no artifacts matched: $IN_ARTIFACTS" >&2
          exit 1
        fi
        printf '%s\n' "${files[@]}" > "${RUNNER_TEMP}/packslip-files"
        {
          echo 'files<<EOF'
          printf '%s\n' "${files[@]}"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Attest build provenance
      if: inputs.attest == 'true'
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: ${{ steps.files.outputs.files }}

    - name: Create and sign the packslip
      id: create
      shell: bash
      env:
        IN_PROJECT: ${{ inputs.project }}
        IN_VERSION: ${{ inputs.version }}
        IN_TAG: ${{ inputs.tag }}
        IN_URL_BASE: ${{ inputs.url-base }}
        IN_BIN: ${{ inputs.bin }}
        IN_SUPERSEDES: ${{ inputs.supersedes }}
        IN_SBOM: ${{ inputs.sbom }}
        IN_ATTEST: ${{ inputs.attest }}
        IN_OUT: ${{ inputs.out }}
        REPO: ${{ github.repository }}
        REF_NAME: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
        SHA: ${{ github.sha }}
        SERVER: ${{ github.server_url }}
        API: ${{ github.api_url }}
      run: |
        set -euo pipefail
        tag="${IN_TAG:-$REF_NAME}"
        if [ -z "$IN_TAG" ] && [ "$REF_TYPE" != tag ]; then
          echo "not running on a tag; pass the tag input" >&2
          exit 1
        fi
        version="${IN_VERSION:-${tag#v}}"
        project="${IN_PROJECT:-github.com/${REPO}}"
        url_base="${IN_URL_BASE:-${SERVER}/${REPO}/releases/download/${tag}}"
        args=(
          create
          --project "$project"
          --version "$version"
          --out "$IN_OUT"
          --url-base "$url_base"
          --source-repo "${SERVER}/${REPO}"
          --tag "$tag"
          --commit "$SHA"
        )
        for b in $IN_BIN; do args+=(--bin "$b"); done
        [ -n "$IN_SUPERSEDES" ] && args+=(--supersedes "$IN_SUPERSEDES")
        [ -n "$IN_SBOM" ] && args+=(--sbom "$IN_SBOM")
        mapfile -t files < "${RUNNER_TEMP}/packslip-files"
        if [ "$IN_ATTEST" = true ]; then
          # GitHub serves each artifact's provenance at the attestations API
          # by subject digest; link one per artifact, in order.
          for f in "${files[@]}"; do
            digest=$(sha256sum "$f" | cut -d' ' -f1)
            args+=(--provenance "${API}/repos/${REPO}/attestations/sha256:${digest}")
          done
        fi
        packslip "${args[@]}" "${files[@]}"
        echo "bundle=${IN_OUT}/packslip.sigstore.json" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Verify what was written
      shell: bash
      env:
        BUNDLE: ${{ steps.create.outputs.bundle }}
      run: packslip verify "$BUNDLE"

    - name: Upload to the release
      if: inputs.upload == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ steps.create.outputs.tag }}
        BUNDLE: ${{ steps.create.outputs.bundle }}
      run: gh release upload "$TAG" "$BUNDLE" --clobber
