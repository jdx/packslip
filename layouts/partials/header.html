<a class="skip-link" href="#main">Skip to content</a>
<header class="wrap top">
  {{ partial "brand.html" . }}
  <nav aria-label="Main">
    <a href="/"{{ if .IsHome }} class="active" aria-current="page"{{ end }}>Overview</a>
    <a href="/docs/"{{ if eq .Section "docs" }} class="active" aria-current="page"{{ end }}>Docs</a>
    <a href="/release/v1/"{{ if eq .RelPermalink "/release/v1/" }} class="active" aria-current="page"{{ end }}>Spec &amp; schemas</a>
    <a href="/cli/"{{ if eq .Section "cli" }} class="active" aria-current="page"{{ end }}>CLI</a>
    {{ partial "github-link.html" . }}
  </nav>
  <form class="search" role="search" action="/docs/" onsubmit="return false">
    <label class="visually-hidden" for="search-input">Search the documentation</label>
    <input id="search-input" type="search" placeholder="Search docs" autocomplete="off" spellcheck="false" aria-controls="search-results" aria-expanded="false">
    <ul id="search-results" class="search-results" hidden></ul>
  </form>
</header>
