# The first release of each action that has each input and output, shown in
# the "Since" column of /docs/actions/. scripts/render-actions.py fails until
# every input and output in action.yml and releases/action.yml has an entry
# here, and when an entry names one that no longer exists, so add the next
# release's version with each new input or output.
#
# Versions are v1 tags without the leading v. What v1.0.0 already had is
# listed as 1.0.0, even if a 0.x release added it, because the reference
# documents the v1 action.

["action.yml".inputs]
artifacts = "1.0.0"
download = "1.0.1"
project = "1.0.0"
version = "1.0.0"
tag = "1.0.0"
commit = "1.3.0"
url-base = "1.0.0"
bin = "1.0.0"
manifest = "1.0.0"
variants = "1.0.0"
formats = "1.0.0"
resources = "1.0.0"
require = "1.0.0"
notes-url = "1.0.0"
extensions = "1.0.0"
attest = "1.0.0"
out = "1.0.0"
upload = "1.0.0"
packslip-version = "1.0.0"
packslip-sha256 = "1.6.0"
packslip-path = "1.0.0"
token = "1.0.0"

["action.yml".outputs]
bundle = "1.0.0"

["releases/action.yml".inputs]
project = "1.1.0"
dir = "1.1.0"
url-base = "1.1.0"
bundle = "1.1.0"
sequence = "1.1.0"
valid-for = "1.1.0"
latest = "1.1.0"
yank = "1.1.0"
security = "1.1.0"
identity-prefix = "1.1.0"
identity = "1.1.0"
issuer = "1.1.0"
allow-other-repository = "1.11.0"
out = "1.1.0"
packslip-version = "1.1.0"
packslip-sha256 = "1.6.0"
packslip-path = "1.1.0"
token = "1.1.0"

["releases/action.yml".outputs]
list = "1.1.0"
count = "1.1.0"
