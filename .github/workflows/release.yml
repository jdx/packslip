name: release

# Runs when release-plz pushes a version tag after its release PR is
# merged (see RELEASING.md). Moving major tags (v0, v1, ...) must not
# start releases of their own.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # A release that shipped before packslip.dev served its own can be
  # described again under that name; see the backfill job.
  workflow_dispatch:
    inputs:
      backfill-tag:
        description: "An existing release tag to publish at packslip.dev"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      major-tag: ${{ steps.version.outputs.major-tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the shared action and CLI version
        id: version
        shell: python
        run: |
          import os
          import re
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit(f"unsupported release version: {version}")
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag} does not match Cargo.toml v{version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"major-tag=v{version.split('.')[0]}\n")

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            asset: linux-x64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            asset: linux-arm64
          # macOS is arm64 only. Every Mac Apple sells runs Apple silicon,
          # and Rosetta 2 runs this binary on the Intel machines that are
          # left, so an x64 build would be a second signed and notarized
          # artifact serving a shrinking audience.
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: darwin-arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset: windows-x64
          # Built natively rather than cross-compiled from the x64 image:
          # aws-lc-sys compiles C and assembly for the host toolchain, and
          # arranging an ARM64 MSVC cross-build is more moving parts than a
          # runner that is already the target.
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            asset: windows-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      # The Developer ID certificate has to be in the keychain before the
      # signing step below can find it.
      - if: contains(matrix.target, 'apple')
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASS }}
      # The runner image ships a stable toolchain; only the cross-compiled
      # targets have to be added to it.
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          # aws-lc-sys (rustls' crypto) builds C on every target: point cc
          # at musl-gcc for the musl targets and use prebuilt NASM objects
          # on Windows.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          AWS_LC_SYS_PREBUILT_NASM: "1"
      # Signing settles who built the binary; notarization is what Gatekeeper
      # demands once a download carries the quarantine bit, which is to say
      # whenever someone fetches it in a browser rather than with curl.
      # Without a ticket it is blocked behind a "cannot be verified" dialog
      # that only a deliberate override gets past.
      #
      # The ticket lives on Apple's side and is keyed to the binary's cdhash,
      # so notarizing does not rewrite the file that gets packaged below.
      # Stapling would, but `stapler` only writes into bundles, disk images,
      # and installer packages, and this is a bare Mach-O in an archive;
      # Gatekeeper resolves the ticket online instead.
      - name: Sign and notarize the macOS binary
        if: contains(matrix.target, 'apple')
        shell: bash
        env:
          BINARY: target/${{ matrix.target }}/release/packslip
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER_ID" ]; then
            echo "::error title=Notarization credentials missing::App Store Connect credentials are required for macOS releases."
            exit 1
          fi

          # --options runtime and --timestamp are what the notary service
          # requires; without them a submission comes back Invalid.
          codesign -f --options runtime --timestamp --prefix dev.jdx. \
            -s "Developer ID Application: Jeffrey Dickey (4993Y37DX6)" "$BINARY"
          codesign --verify --strict --verbose=2 "$BINARY"

          # Outside the workspace, so no later step can sweep the key into an
          # artifact, and removed even when notarization fails.
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$work/key.p8"

          # notarytool takes a container, never a bare executable. A copy is
          # fine: a Mach-O carries its signature inline, so the cdhash the
          # ticket is keyed to is the one that ships.
          mkdir "$work/stage"
          cp "$BINARY" "$work/stage/"
          ditto -c -k --norsrc --noextattr "$work/stage" "$work/submission.zip"

          # `--wait` is not a gate on its own: it can return zero on an
          # Invalid submission, so the reported status is what decides.
          # plutil reads JSON and ships with macOS, which keeps this off jq.
          result="$(xcrun notarytool submit "$work/submission.zip" \
            --key "$work/key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --output-format json \
            --timeout 30m \
            --wait)"
          echo "$result"

          status="$(printf '%s' "$result" | plutil -extract status raw -o - -)"
          id="$(printf '%s' "$result" | plutil -extract id raw -o - -)"
          if [ "$status" != "Accepted" ]; then
            echo "::error::notarization returned $status for submission $id"
            xcrun notarytool log "$id" \
              --key "$work/key.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" || true
            exit 1
          fi
          echo "notarized: submission $id"
      - name: Package
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="packslip-v${version}-${{ matrix.asset }}"
          mkdir -p "dist/$name"
          if [[ "$PACKAGE_TARGET" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/packslip.exe" "dist/$name/"
            (cd dist && 7z a -bd "$name.zip" "$name" >/dev/null)
          else
            cp "target/${{ matrix.target }}/release/packslip" "dist/$name/"
            tar -C dist -cJf "dist/$name.tar.xz" "$name"
          fi
          rm -r "dist/$name"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Communiqué compares this tag with the previous release and needs
          # the intervening commits and tags to write accurate notes.
          fetch-depth: 0
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        continue-on-error: true
        with:
          install_args: communique
        env:
          # A stale lock must fail instead of silently changing the release-
          # note generator selected by `communique = "latest"`.
          MISE_LOCKED: "1"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache: false
      - name: Install completion syntax checkers
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish
          mise install github:PowerShell/PowerShell@7.5.4
      - name: Generate the CLI specification and completions
        run: |
          set -euo pipefail
          mkdir -p bin
          tar -xJf "dist/packslip-${GITHUB_REF_NAME}-linux-x64.tar.xz" --strip-components=1 -C bin
          bin/packslip usage > dist/packslip.usage.kdl
          for shell in bash zsh fish powershell; do
            bin/packslip completion "$shell" > "dist/packslip.$shell"
            test -s "dist/packslip.$shell"
            grep -Fq '__complete_word__' "dist/packslip.$shell"
            bin/packslip __complete_word__ --shell "$shell" --line 'packslip ver' | grep -Fq -- 'verify'
          done
          bash -n dist/packslip.bash
          zsh -n dist/packslip.zsh
          fish --no-execute dist/packslip.fish
          mise exec github:PowerShell/PowerShell@7.5.4 -- pwsh -NoProfile -Command - <<'POWERSHELL'
          $ErrorActionPreference = 'Stop'
          foreach ($script in Get-ChildItem -LiteralPath "dist" -Filter '*.powershell') {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count) { $parseErrors | Write-Error; exit 1 }
          }
          POWERSHELL
      - name: Attest the release files
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*
      # Keep the release private until its narrative notes and signed packslip
      # are ready. If Communiqué fails, the generated GitHub notes remain as a
      # serviceable fallback and the release can still proceed.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes dist/*
      - name: Rewrite the release body with Communiqué
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: communique generate "$GITHUB_REF_NAME" --github-release
      # Dogfood: the binary just built signs its own release manifest with
      # this job's identity, as the project packslip.dev, and publishes the
      # files and the bundle where that name says they are. The bundle is
      # attached to the GitHub release too, for anyone reading it there.
      - name: Publish this release's packslip
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p bin
          tar -xJf "dist/packslip-v${TAG#v}-linux-x64.tar.xz" --strip-components=1 -C bin
          PATH="$PWD/bin:$PATH" scripts/describe-release.sh
          gh release upload "$TAG" packslip/packslip.sigstore.json --clobber
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
      # The action follows releases of the same CLI major, only after the
      # binaries are public. A push made with
      # the built-in token starts no workflow, so this cannot recurse.
      - name: Move the shared major action tag
        env:
          MAJOR_TAG: ${{ needs.version.outputs.major-tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Moved through the refs API rather than `git push -f`. A push
          # sends the tag's tree, and GitHub refuses one from the built-in
          # token when that tree touches .github/workflows -- which any
          # release since the last major-tag move may well do, and there is
          # no `workflows` key in a job's permissions to grant. The commit
          # is already on the default branch, so updating the ref pushes no
          # objects and the check does not apply.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${MAJOR_TAG}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${MAJOR_TAG}" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            echo "moved $MAJOR_TAG to $GITHUB_SHA"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${MAJOR_TAG}" -f sha="$GITHUB_SHA" >/dev/null
            echo "created $MAJOR_TAG at $GITHUB_SHA"
          fi

  # The release index at https://packslip.dev/.well-known/packslip.json,
  # rebuilt once the release above is public so the action can install the
  # CLI it was released with.
  list:
    needs: release
    uses: ./.github/workflows/packslip-releases.yml
    secrets:
      CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
      CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
    permissions:
      contents: read
      id-token: write

  # Describe an earlier release as packslip.dev. It runs from this workflow
  # file on purpose: a consumer remembers which workflow signed a project's
  # bundles, and a backfilled release must not look like a different signer.
  backfill:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.backfill-tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The tag's commit is recorded in the bundle.
          fetch-depth: 0
      - name: Install packslip
        env:
          GH_TOKEN: ${{ github.token }}
          PACKSLIP_VERSION: ""
          PACKSLIP_PATH: ""
          PACKSLIP_ACTION_ROOT: .
        run: bash scripts/install-packslip.sh
      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist
          # The bundle that shipped with it names github.com/jdx/packslip;
          # a new one is written for packslip.dev.
          rm -f dist/packslip*.sigstore.json
          ls -la dist
          echo "published_at=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json publishedAt -q .publishedAt)" >> "$GITHUB_ENV"
          echo "commit=$(git rev-list -n1 "$TAG")" >> "$GITHUB_ENV"
      - name: Publish the release's packslip
        env:
          COMMIT: ${{ env.commit }}
          PUBLISHED_AT: ${{ env.published_at }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
        run: scripts/describe-release.sh

  backfill-list:
    needs: backfill
    uses: ./.github/workflows/packslip-releases.yml
    secrets:
      CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
      CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
    permissions:
      contents: read
      id-token: write
