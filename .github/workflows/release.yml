name: release

# Runs when release-plz pushes a version tag after its release PR is
# merged (see RELEASING.md). `v1` is the action's major tag, moved by
# this workflow; it must not start a release of its own.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            asset: linux-x64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            asset: linux-arm64
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: darwin-arm64
          - target: x86_64-apple-darwin
            runner: macos-latest
            asset: darwin-x64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          # aws-lc-sys (rustls' crypto) builds C on every target: point cc
          # at musl-gcc for the musl targets and use prebuilt NASM objects
          # on Windows.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          AWS_LC_SYS_PREBUILT_NASM: "1"
      - name: Package
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="packslip-v${version}-${{ matrix.asset }}"
          mkdir -p "dist/$name"
          if [[ "$PACKAGE_TARGET" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/packslip.exe" "dist/$name/"
            (cd dist && 7z a -bd "$name.zip" "$name" >/dev/null)
          else
            cp "target/${{ matrix.target }}/release/packslip" "dist/$name/"
            tar -C dist -cJf "dist/$name.tar.xz" "$name"
          fi
          rm -r "dist/$name"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Communiqué compares this tag with the previous release and needs
          # the intervening commits and tags to write accurate notes.
          fetch-depth: 0
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        continue-on-error: true
        with:
          install_args: communique
        env:
          # A stale lock must fail instead of silently changing the release-
          # note generator selected by `communique = "latest"`.
          MISE_LOCKED: "1"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Include the CLI specification
        run: cp packslip.usage.kdl dist/packslip.usage.kdl
      - name: Attest the release files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      # Keep the release private until its narrative notes and signed packslip
      # are ready. If Communiqué fails, the generated GitHub notes remain as a
      # serviceable fallback and the release can still proceed.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes dist/*
      - name: Rewrite the release body with Communiqué
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: communique generate "$GITHUB_REF_NAME" --github-release
      # Dogfood: the binary just built signs its own release manifest with
      # this job's identity, then verifies it under the policy the project
      # name github.com/jdx/packslip implies.
      - name: Publish this release's packslip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p bin
          tar -xJf "dist/packslip-v${version}-linux-x64.tar.xz" --strip-components=1 -C bin
          args=()
          for f in dist/*; do
            digest=$(sha256sum "$f" | cut -d' ' -f1)
            args+=(--provenance "${f##*/}=${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/attestations/sha256:${digest}")
          done
          bin/packslip create \
            --project "github.com/${GITHUB_REPOSITORY}" \
            --version "$version" \
            --out packslip \
            --url-base "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --source-repo "https://github.com/${GITHUB_REPOSITORY}" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --bin packslip \
            --resource cli-spec/usage=asset:dist/packslip.usage.kdl \
            "${args[@]}" \
            dist/*
          bin/packslip verify packslip/packslip.sigstore.json \
            --artifact "dist/packslip-v${version}-linux-x64.tar.xz" \
            --artifact dist/packslip.usage.kdl
          gh release upload "$GITHUB_REF_NAME" packslip/packslip.sigstore.json --clobber
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
      # `uses: jdx/packslip@v1` follows the latest release. A push made with
      # the built-in token starts no workflow, so this cannot recurse.
      - name: Move the v1 action tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git tag -f v1 "$GITHUB_SHA"
            if git push -f origin v1; then
              break
            fi
            git fetch origin "refs/tags/v1:refs/tags/v1" -f || true
            [ "$attempt" -lt 3 ] || exit 1
          done
