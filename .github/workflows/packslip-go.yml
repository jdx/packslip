name: packslip-go

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - go/**
      - tests/conformance/statement-validity.json
      - .github/workflows/packslip-go.yml
      - tests/go_conformance.rs

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.2
          check-latest: false
          cache: false
      - run: go mod tidy
      - run: test -z "$(git status --porcelain -- go.mod go.sum)"
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...

  rust-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.2
          check-latest: false
          cache: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
      - run: cargo test --test go_conformance
        env:
          PACKSLIP_GO_CONFORMANCE: "1"
