name: packslip-go

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - go/**
      - tests/conformance/statement-validity.json
      - .github/workflows/packslip-go.yml
      - tests/go_conformance.rs

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.3
          check-latest: false
          cache: false
      - run: go mod tidy
      - run: test -z "$(git status --porcelain -- go.mod go.sum)"
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...

  rust-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.3
          check-latest: false
          cache: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: false
      - run: cargo test --test go_conformance
        env:
          PACKSLIP_GO_CONFORMANCE: "1"
