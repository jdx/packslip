name: site

# packslip.dev: the Hugo site as a Worker's static assets, with the
# project's releases served from R2 by cloudflare/worker.js. The Worker is
# configured in wrangler.jsonc.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
    steps:
      - uses: actions/checkout@v5
      - name: Install Hugo
        run: |
          wget -O "${RUNNER_TEMP}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
      - name: Fetch GitHub stars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}" --jq '{stars: .stargazers_count}' > data/github.json
      - name: Build site
        run: |
          hugo --gc --minify
          if grep -R -I -F '%!' public; then
            echo "Hugo rendered a formatting error"
            exit 1
          fi
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_TOKEN }}
          command: deploy
