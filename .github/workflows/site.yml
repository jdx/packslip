name: site

# packslip.dev: the Hugo site as a Worker's static assets, with the
# project's releases served from R2 by cloudflare/worker.js. The Worker is
# configured in wrangler.jsonc. The installer job deploys packslip.sh,
# configured in cloudflare/installer/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A deployment in flight finishes; only the newest waiting run follows it.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Hugo comes from mise.toml, like the docs check in CI, so the deploy
      # builds with the version that was validated.
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: false
          install_args: hugo
      - name: Fetch GitHub stars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}" --jq '{stars: .stargazers_count}' > data/github.json
      - name: Build site
        run: |
          hugo --gc --minify
          if grep -R -I -F '%!' public; then
            echo "Hugo rendered a formatting error"
            exit 1
          fi
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_TOKEN }}
          command: deploy

  # packslip.sh, which serves the install scripts each release publishes.
  # A Worker of its own, deployed apart from the site so that a failed
  # Hugo build never holds it back.
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_TOKEN }}
          command: deploy --config cloudflare/installer/wrangler.jsonc
