name: site

# packslip.dev: the Hugo site as a Worker's static assets, with the
# project's releases served from R2 by cloudflare/worker.js. The Worker is
# configured in wrangler.jsonc.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Hugo comes from mise.toml, like the docs check in CI, so the deploy
      # builds with the version that was validated.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          install_args: hugo
      - name: Fetch GitHub stars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}" --jq '{stars: .stargazers_count}' > data/github.json
      - name: Build site
        run: |
          hugo --gc --minify
          if grep -R -I -F '%!' public; then
            echo "Hugo rendered a formatting error"
            exit 1
          fi
      - uses: cloudflare/wrangler-action@4e88846969242f7752bcfdaf5511bfbb3985ca47 # v4.1.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_TOKEN }}
          command: deploy
