name: packslip-releases

# packslip.dev is a project on its own domain, so its release list is the
# release index: consumers see the releases it names and nothing else, and
# refuse it once it expires. release.yml calls this after each release; the
# schedule re-signs it before the 30-day validity runs out.
#
# Every run rebuilds the list from scratch, so withdrawals and security
# marks live in .github/packslip/yanked and .github/packslip/security,
# which every run reads from main. A change to either file publishes a new
# list on merge. A dispatch only re-signs the list as it stands.
on:
  workflow_call:
    secrets:
      CLOUDFLARE_ACCESS_KEY_ID:
        required: true
      CLOUDFLARE_SECRET_ACCESS_KEY:
        required: true
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/packslip/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packslip-releases

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
      AWS_REGION: auto
      AWS_ENDPOINT_URL: https://6e243906ff257b965bcae8025c2fc344.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The checkout above is the ref that triggered the run, which the
      # action needs to be the version released with. For a post-release run
      # that is the tag, cut before a withdrawal merged during the release
      # build, and for a dispatch from a branch it can be older still, so
      # the withdrawals come from main instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: withdrawals
          sparse-checkout: .github/packslip
          persist-credentials: false
      - name: Read the withdrawals
        id: withdrawn
        run: |
          set -euo pipefail
          # Blank lines and # comments are for people; the action takes entries only.
          entries() {
            local file="withdrawals/.github/packslip/$1"
            # A missing file must fail the run, not publish a list that quietly
            # restores every withdrawn release.
            [ -f "$file" ] || { echo "$file is missing" >&2; exit 1; }
            grep -Ev '^[[:space:]]*(#|$)' "$file" || [ $? -eq 1 ]
          }
          delimiter="packslip_$(openssl rand -hex 16)"
          {
            echo "yank<<$delimiter"
            entries yanked
            echo "$delimiter"
            echo "security<<$delimiter"
            entries security
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - name: Fetch the published bundles
        run: |
          set -euo pipefail
          aws s3 sync s3://jdx-releases/packslip/ lists/ --exclude '*' --include '*/packslip.sigstore.json'
          ls lists
      - name: Resolve the published CLI for maintenance runs
        id: cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: ./releases
        id: list
        with:
          project: packslip.dev
          # main may be newer than the most recent digest map. This explicit
          # maintenance override retains the existing provenance verification.
          packslip-version: ${{ steps.cli.outputs.version }}
          dir: lists
          url-base: https://packslip.dev
          yank: ${{ steps.withdrawn.outputs.yank }}
          security: ${{ steps.withdrawn.outputs.security }}
      - name: Publish the list
        env:
          LIST: ${{ steps.list.outputs.list }}
          COUNT: ${{ steps.list.outputs.count }}
        run: |
          set -euo pipefail
          aws s3 cp "$LIST" s3://jdx-releases/packslip/.well-known/packslip.json \
            --content-type application/json --cache-control "public, max-age=300"
          echo "published a list of $COUNT release(s) at https://packslip.dev/.well-known/packslip.json"
