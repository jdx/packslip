# Releases are manual: release-plz keeps a release PR open with the next
# version and changelog; merging it publishes the crate and pushes the
# vX.Y.Z tag, which starts release.yml. See RELEASING.md.
name: release-plz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release-pr:
    if: github.repository_owner == 'jdx'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false
      - id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          # A PAT, not the built-in token: a PR or tag pushed with the
          # built-in token starts no workflow, so CI would never run on
          # the release PR and release.yml would never build the binaries.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Regenerate CLI documentation in the release PR
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          RELEASE_PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          set -euo pipefail
          pr_number=$(jq -r '.number' <<<"$RELEASE_PR")
          gh pr checkout "$pr_number"
          mise run render
          git add packslip.usage.kdl content/cli
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate CLI documentation"
            git push
          fi

  # Publishes to crates.io and pushes the tag once a release PR has been
  # merged. Gated on a repository variable so that enabling this workflow
  # cannot publish the current HEAD by itself: the first crates.io publish
  # is manual, then Trusted Publishing is registered, then the variable
  # is set (RELEASING.md).
  release:
    if: github.repository_owner == 'jdx' && vars.RELEASE_PLZ_RELEASE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: crates-io-auth
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
