name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo build --all-features
      - run: cargo test --all-features
      # A consumer that only verifies takes the crate with no default
      # features; keep that build compiling and its tests passing.
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      - run: cargo test --no-default-features
      - run: cargo clippy --no-default-features --features trust-root --all-targets -- -D warnings
      - run: cargo test --no-default-features --features trust-root
      - run: cargo clippy --no-default-features --features verify-cli --all-targets -- -D warnings
      - run: cargo test --no-default-features --features verify-cli
      - run: cargo clippy --no-default-features --features install-cli --all-targets -- -D warnings
      - run: cargo test --no-default-features --features install-cli
      - run: cargo clippy --no-default-features --features verify-cli,sign --all-targets -- -D warnings
      - run: cargo test --no-default-features --features verify-cli,sign --test verifier_cli
      - run: mise run lint
      - run: hk check --all
      - run: mise run render
      - run: usage lint packslip.usage.kdl
      - run: mise run docs:check
      - name: Verify generated CLI documentation
        run: |
          set -euo pipefail
          test -f public/cli/index.html
          for page in completion create install keygen pin releases schema show verify version; do
            test -f "public/cli/${page}/index.html"
          done
          if grep -R -E 'href="[^"]+\.md([#?][^"]*)?"' public/cli; then
            echo "generated CLI documentation contains a .md link" >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::'mise run render' produced changes. Run it locally and commit."
            git status --short
            git diff HEAD
            exit 1
          fi

  zizmor:
    name: GitHub Actions security analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

  extraction:
    name: extraction (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-26, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: extraction-${{ matrix.runner }}
      - run: cargo clippy --no-default-features --features install-extract --lib -- -D warnings
      - run: cargo test --no-default-features --features install-extract --lib install_extract
      # Cache snapshots must survive replacement on native Windows as well.
      - run: cargo test --no-default-features --features discovery --lib discovery
      - run: cargo clippy --no-default-features --features install-fs --lib -- -D warnings
      - run: cargo test --no-default-features --features install-fs --lib install_fs
      - run: cargo clippy --no-default-features --features install-launcher --lib -- -D warnings
      - run: cargo test --no-default-features --features install-launcher --lib install_launcher
      - run: cargo test --no-default-features --features install-launcher --lib launcher_payload
      - run: cargo clippy --no-default-features --features install-host --lib -- -D warnings
      - run: cargo test --no-default-features --features install-host --lib install_host
      - run: cargo clippy --no-default-features --features install-cli --all-targets -- -D warnings
      - run: cargo test --no-default-features --features install-cli --lib install::tests

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: jdx/packslip
          # Published v1.4.0. Keep this baseline as newer releases are added.
          ref: 87479dfc6443253dff69601cace5fc6ea07e6df5
          path: .compatibility/baseline
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            .compatibility/baseline -> target
      - run: cargo build --locked --manifest-path .compatibility/baseline/Cargo.toml
      - name: Cross-version verification and installer fixtures
        env:
          PACKSLIP_BASELINE_BIN: ${{ github.workspace }}/.compatibility/baseline/target/debug/packslip
        run: |
          cargo test --locked --no-default-features --features install-cli --test compatibility
          cargo test --locked --no-default-features --features trust-root --lib trust_root::tests
          cargo test --locked --no-default-features --features install-cli --lib install::tests

  # Both schemes end to end against the public log. Only on main, where the
  # id-token permission is available.
  signing:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release
      - name: Keyless, with this job's identity
        run: |
          set -euo pipefail
          mkdir -p dist
          printf 'linux\n' > dist/tool-v0.0.0-linux-x64.tar.xz
          printf 'darwin\n' > dist/tool-v0.0.0-darwin-arm64.tar.xz
          ./target/release/packslip create \
            --project "github.com/${GITHUB_REPOSITORY}" \
            --version 0.0.0 \
            --out dist \
            --url-base "https://example.invalid/${GITHUB_REPOSITORY}/0.0.0" \
            --bin tool \
            --resource completion/zsh=archive:share/zsh/site-functions/_tool \
            --resource 'completion/bash,zsh,fish=exec:tool completion {shell}' \
            --resource 'cli-spec/usage=exec:tool usage' \
            dist/tool-v0.0.0-linux-x64.tar.xz dist/tool-v0.0.0-darwin-arm64.tar.xz
          ./target/release/packslip show dist/packslip.sigstore.json
          ./target/release/packslip verify dist/packslip.sigstore.json \
            --artifact dist/tool-v0.0.0-linux-x64.tar.xz --json
          # A tool in a monorepo: subpath name, its own file, same pin.
          printf 'fips\n' > dist/tool-fips-v0.0.0-linux-x64.tar.xz
          ./target/release/packslip create \
            --project "github.com/${GITHUB_REPOSITORY}/tool" \
            --version 0.0.0 \
            --out dist \
            --bin tool=bin/tool-x86_64 \
            dist/tool-v0.0.0-linux-x64.tar.xz "dist/tool-fips-v0.0.0-linux-x64.tar.xz@fips"
          test -f dist/packslip.tool.sigstore.json
          ./target/release/packslip verify dist/packslip.tool.sigstore.json
          # A wrong repository must be refused.
          if ./target/release/packslip verify dist/packslip.sigstore.json \
               --identity-prefix "https://github.com/someone-else/repo/" \
               --issuer https://token.actions.githubusercontent.com; then
            echo "verification accepted the wrong identity" >&2
            exit 1
          fi
      - name: With a key, logged to Rekor, plus a release list
        run: |
          set -euo pipefail
          mkdir -p keyed
          ./target/release/packslip keygen -o keyed/release.key
          ./target/release/packslip create \
            --project tool.example.com \
            --version 0.0.0 \
            --key keyed/release.key \
            --out keyed \
            dist/tool-v0.0.0-linux-x64.tar.xz
          ./target/release/packslip verify keyed/packslip.sigstore.json \
            --pubkey keyed/release.pub --artifact dist/tool-v0.0.0-linux-x64.tar.xz
          ./target/release/packslip releases \
            --project tool.example.com --sequence 1 --valid-for 1d \
            --release "https://tool.example.com/0.0.0/packslip.sigstore.json=keyed/packslip.sigstore.json" \
            --key keyed/release.key --out keyed/releases.sigstore.json
          ./target/release/packslip verify keyed/releases.sigstore.json --pubkey keyed/release.pub
          # The wrong key must be refused.
          ./target/release/packslip keygen -o keyed/other.key
          if ./target/release/packslip verify keyed/packslip.sigstore.json --pubkey keyed/other.pub; then
            echo "verification accepted the wrong key" >&2
            exit 1
          fi
      # The releases action, over a directory laid out the way a download
      # host is: <tag>/packslip.sigstore.json, signed by this job.
      - name: A bundle for the releases action
        run: |
          set -euo pipefail
          mkdir -p lists/v0.0.0
          ./target/release/packslip create \
            --project ci.packslip.invalid \
            --version 0.0.0 \
            --out lists/v0.0.0 \
            --url-base https://ci.packslip.invalid/v0.0.0 \
            --source-repo "https://github.com/${GITHUB_REPOSITORY}" \
            --tag v0.0.0 \
            --commit "$GITHUB_SHA" \
            dist/tool-v0.0.0-linux-x64.tar.xz
      - uses: ./releases
        id: list
        with:
          project: ci.packslip.invalid
          dir: lists
          url-base: https://ci.packslip.invalid
          valid-for: 1d
          packslip-path: target/release/packslip
      - name: The list names that release
        env:
          COUNT: ${{ steps.list.outputs.count }}
          LIST: ${{ steps.list.outputs.list }}
        run: |
          set -euo pipefail
          test "$COUNT" = 1
          ./target/release/packslip show "$LIST" \
            | jq -e '.predicate.project == "ci.packslip.invalid" and (.predicate.releases | length == 1)' >/dev/null

  # Aggregator that required-status-checks can target. If any upstream job
  # failed, was cancelled, or was unexpectedly skipped, this step exits non-zero
  # so the PR is blocked. Lets the branch-protection rule depend on one name
  # instead of N.
  final:
    needs:
      - signing
      - test
      - zizmor

      - extraction
      - compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    # Run on success or upstream failure but skip when the workflow is cancelled
    # — `always()` would override `cancel-in-progress` and waste a runner.
    if: ${{ !cancelled() }}
    steps:
      - name: Gate on upstream job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          # `signing` only runs on a push, where id-token is available; being
          # skipped on a pull request is expected, not a failure.
          ALLOW_SKIPPED = {"signing"}

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = False
          for name, data in sorted(needs.items()):
              result = data.get("result", "unknown")
              if result == "success" or (result == "skipped" and name in ALLOW_SKIPPED):
                  print(f"::notice::{name}: {result}")
              else:
                  print(f"::error::{name}: {result}")
                  failed = True

          if failed:
              print("One or more upstream jobs did not complete successfully.")
              sys.exit(1)

          print("All CI jobs completed successfully.")
          PY
