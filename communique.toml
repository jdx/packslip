context = """
packslip is a signed release-manifest format and CLI for vendor binaries. A manifest records
what shipped and how to verify it, including checksums, target platforms, executables, and
provenance links. Producers sign manifests with Sigstore or Ed25519, and consumers verify them
against a pinned repository identity or public key without vendor-specific logic or a registry.
The repository also provides the `jdx/packslip` GitHub Action and hosts the draft specification
at packslip.dev.
"""

system_extra = """
packslip is a work-in-progress proposal, not an adopted standard. Its version 1 format and CLI
may still change incompatibly, and neither mise nor Omarchy currently depends on it. Match that
status: do not imply broad adoption, production maturity, or guaranteed future compatibility.
Describe what changed and why, and call out breaking changes plainly.
"""

