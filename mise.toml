min_version = "2026.9.7"

[tools]
mr-boxington = { version = "latest", minimum_release_age = "0s" }
# Keep release-note generation reproducible. `latest` is resolved by mise.lock;
# update the lock deliberately with `mise lock`.
communique = { version = "latest", minimum_release_age = "0s" }
hk = { version = "latest", minimum_release_age = "0s" }
hugo = "0.168.0"
jactionlint = "latest"
shellcheck = "0.11.0"
usage = { version = "latest", minimum_release_age = "0s" }

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[tasks.build]
run = "cargo build"

[tasks.lint]
description = "Check the shell scripts the actions, workflows, and install scripts run"
run = "shellcheck scripts/*.sh installer/*.sh container/*.sh"

[tasks.render]
description = "Generate the usage spec, CLI reference, schemas, spec page, and actions reference"
depends = ["build"]
run = [
  "target/debug/packslip usage > packslip.usage.kdl",
  "usage generate manpage --file packslip.usage.kdl --out-file packslip.1",
  "target/debug/packslip schema > static/schema/release-v1.json",
  "target/debug/packslip schema --releases > static/schema/releases-v1.json",
  "target/debug/packslip schema --report > static/schema/verify-report-v1.json",
  # The site renders the spec from its canonical text.
  # Both predicate types must resolve: the list predicate is /releases/v1.
  # Its contents list the H4 field tables too.
  "{ printf -- '---\ntitle: packslip release/v1 specification\nurl: /release/v1/\naliases:\n  - /releases/v1/\ntoc_end_level: 4\n---\n'; cat docs/spec/packslip.md; } > content/spec.md",
  # The CLI reference: a page per command from
  # docs/templates/cli-command.md.tera, whose front matter titles, describes,
  # and orders each page.
  "rm -rf content/cli && mkdir -p content/cli",
  "usage generate markdown --multi --file packslip.usage.kdl --out-dir content/cli --url-prefix /cli --link-extension / --html-encode --template command=docs/templates/cli-command.md.tera",
  # usage writes its banner first, but Hugo reads front matter only there.
  '''perl -0pi -e 's/\A(<!--[^\n]*-->\n)(---\n.*?\n---\n)/$2$1/s' content/cli/*.md''',
  # The overview is docs/cli.md, which lists the commands by role, in place
  # of usage's generated index.
  "{ cat docs/cli.md; printf '\\n<!-- @generated from docs/cli.md by mise run render -->\\n'; } > content/cli/_index.md && rm content/cli/index.md",
  # The actions reference: docs/actions.md with tables from both action.yml files.
  "python3 scripts/render-actions.py",
]

[tasks.docs]
description = "Serve the generated documentation locally"
depends = ["render"]
run = "hugo server"

[tasks."docs:build"]
description = "Build the generated documentation"
depends = ["render"]
run = "hugo --gc --minify"

[tasks."docs:check"]
description = "Build docs, check internal links, and run offline documentation examples"
depends = ["docs:build"]
run = "python3 scripts/check-docs.py"
