baseURL = "https://packslip.dev/"
locale = "en-US"
title = "packslip"
disableHugoGeneratorInject = true
disableKinds = ["rss", "sitemap", "taxonomy", "term"]

[outputFormats]
  [outputFormats.SearchIndex]
    mediaType = "application/json"
    baseName = "search-index"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "SearchIndex"]

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[markup]
  # Typographer turns "--key" in prose into an en dash and curls the quotes
  # in commands, so a reader copying them gets something that does not run.
  [markup.goldmark.extensions.typographer]
    disable = true
  # A {.class} line under a table gives it that class; render-table.html
  # copies it onto the <table>. scripts/render-actions.py marks its tables.
  [markup.goldmark.parser.attribute]
    block = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.highlight]
    noClasses = false
