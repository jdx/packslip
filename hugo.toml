baseURL = "https://packslip.dev/"
locale = "en-US"
title = "packslip"
disableHugoGeneratorInject = true
disableKinds = ["rss", "sitemap", "taxonomy", "term"]

[outputFormats]
  [outputFormats.SearchIndex]
    mediaType = "application/json"
    baseName = "search-index"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "SearchIndex"]

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.highlight]
    noClasses = false
