# Releases of another project's software. kind is "repackager" when the
# statement says "attested_by": "repackager" and its artifacts are the
# vendor's own files, or "build" when the publisher builds the upstream
# source and signs its own build as the vendor of its project. Any other
# kind fails the site build. prerelease marks a GitHub prerelease, as above.

