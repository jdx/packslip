# Tools that have published a signed packslip release bundle, rendered on
# /docs/who-is-using-packslip/ by layouts/shortcodes/adopters.html. The page
# takes its counts and both dates from this file.
#
# surveyed is the date of the last search for published bundles. Change it
# only after a fresh search for new adopters. Adding or changing a row
# without that search leaves it as it is.
#
# checked and checked_with record the last check of every listed bundle.
# Every row links a GitHub release (github.com/<repository>/releases/tag/<tag>)
# and the bundle attached to it (<bundle>). When you add or change a row,
# check every listed bundle again, then update checked and checked_with:
# compare each bundle with the SHA-256 digest GitHub records for the asset,
# then run packslip verify --issuer https://token.actions.githubusercontent.com
# --source-repository https://github.com/<repository> on it.

surveyed = "2026-10-13"
checked = "2026-10-13"
checked_with = "1.7.0"

